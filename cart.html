<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Jai Sri Ram Bull Driven Oils</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

<nav>
    <div class="logo">
        <div class="logo-circle">
            <img src="img/bull.png" alt="Ram Logo">
        </div>
        <span>Jai Sri Ram Bull Driven Oils</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html" class="active">Cart</a></li>
    </ul>
</nav>

<section class="cart-section">
    <h1>Your Shopping Cart</h1>

    <table id="cart-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cart-body"></tbody>
    </table>
    <div id="empty-message">Your cart is empty.</div>

    <h3>Grand Total: ₹<span id="grand-total">0</span></h3>

    <div class="delivery-section">
        <h4>Delivery Details</h4>
        <input type="text" id="customer-name" placeholder="Full Name">
        <input type="tel" id="customer-contact" placeholder="Contact Number">
        <input type="email" id="customer-email" placeholder="Email">

        <select id="customer-country" onchange="populateStates()">
            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="Australia">Australia</option>
        </select>

        <select id="customer-state">
           <option value="">Select State</option>
<option value="Andhra Pradesh">Andhra Pradesh</option>
<option value="Arunachal Pradesh">Arunachal Pradesh</option>
<option value="Assam">Assam</option>
<option value="Bihar">Bihar</option>
<option value="Chhattisgarh">Chhattisgarh</option>
<option value="Goa">Goa</option>
<option value="Gujarat">Gujarat</option>
<option value="Haryana">Haryana</option>
<option value="Himachal Pradesh">Himachal Pradesh</option>
<option value="Jharkhand">Jharkhand</option>
<option value="Karnataka">Karnataka</option>
<option value="Kerala">Kerala</option>
<option value="Madhya Pradesh">Madhya Pradesh</option>
<option value="Maharashtra">Maharashtra</option>
<option value="Manipur">Manipur</option>
<option value="Meghalaya">Meghalaya</option>
<option value="Mizoram">Mizoram</option>
<option value="Nagaland">Nagaland</option>
<option value="Odisha">Odisha</option>
<option value="Punjab">Punjab</option>
<option value="Rajasthan">Rajasthan</option>
<option value="Sikkim">Sikkim</option>
<option value="Tamil Nadu">Tamil Nadu</option>
<option value="Telangana">Telangana</option>
<option value="Tripura">Tripura</option>
<option value="Uttar Pradesh">Uttar Pradesh</option>
<option value="Uttarakhand">Uttarakhand</option>
<option value="West Bengal">West Bengal</option>
        </select>

        <input type="text" id="customer-city" placeholder="City">
        <input type="text" id="customer-pincode" placeholder="Pincode">
        <textarea id="customer-address" placeholder="Full Address"></textarea>
    </div>

    <button class="checkout-btn" onclick="proceedUPIPayment()">Checkout & Pay</button>
    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>

    <!-- PAYMENT UI -->
    <div id="payment-section" style="display:none; margin-top:20px;"></div>

    <!-- ORDER STATUS -->
    <div id="order-status-box" style="display:none; margin-top:20px; padding:15px; border:2px solid orange; border-radius:10px;">
        <p><strong>Order Reference ID:</strong> <span id="order-id"></span></p>
        <p id="payment-status" style="color:orange; font-weight:bold;">Payment Status: Pending</p>

        <input type="checkbox" id="payment-confirm">
        <label for="payment-confirm">I have completed the payment</label>
    </div>
</section>

<footer class="custom-footer">
    <p>&copy; 2025 Jai Sri Ram Bull Driven Oils</p>
</footer>

<script>
// -------------------- STATE DATA --------------------
const countryStates = {
    "India": ["Andhra Pradesh","Telangana","Karnataka","Maharashtra","Tamil Nadu"],
    "USA": ["California","Texas","Florida"],
    "Australia": ["New South Wales","Victoria"]
};

function populateStates() {
    const stateSelect = document.getElementById("customer-state");
    stateSelect.innerHTML = "<option value=''>Select State</option>";
    const states = countryStates[customer-country.value];
    if(states) {
        states.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s;
            opt.textContent = s;
            stateSelect.appendChild(opt);
        });
    }
}

// -------------------- CART LOGIC --------------------
function loadCart() {
    const cart = JSON.parse(localStorage.getItem("sriRamaCart")) || [];
    const tbody = document.getElementById("cart-body");
    const empty = document.getElementById("empty-message");
    let total = 0;

    tbody.innerHTML = "";
    if(cart.length === 0) {
        empty.style.display = "block";
        return;
    }
    empty.style.display = "none";

    cart.forEach((item, i) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        tbody.innerHTML += `
            <tr>
                <td>${item.name}</td>
                <td>₹${item.price}</td>
                <td>${item.qty}</td>
                <td>₹${itemTotal}</td>
                <td><button onclick="removeItem(${i})">X</button></td>
            </tr>`;
    });
    document.getElementById("grand-total").innerText = total;
}

function removeItem(i) {
    const cart = JSON.parse(localStorage.getItem("sriRamaCart")) || [];
    cart.splice(i,1);
    localStorage.setItem("sriRamaCart", JSON.stringify(cart));
    loadCart();
}

function clearCart() {
    localStorage.removeItem("sriRamaCart");
    loadCart();
}

// -------------------- ORDER ID --------------------
function generateOrderId() {
    return "ORD-" + Date.now();
}

// -------------------- PAYMENT --------------------
function proceedUPIPayment() {
    const cart = JSON.parse(localStorage.getItem("sriRamaCart")) || [];
    if(cart.length === 0) return alert("Cart is empty");

    const name = customer-name.value.trim();
    const contact = customer-contact.value.trim();
    const address = customer-address.value.trim();
    if(!name || !contact || !address) return alert("Fill delivery details");

    const orderId = generateOrderId();
    const total = cart.reduce((s,i)=>s+(i.price*i.qty),0);
    const upiLink = `upi://pay?pa=709592492@ybl&pn=JaiSriRamOils&am=${total}&cu=INR`;

    const msg = `Order ID: ${orderId}\nAmount: ₹${total}\nName: ${name}\nContact: ${contact}\nAddress: ${address}`;
    window.open(`https://wa.me/917095924929?text=${encodeURIComponent(msg)}`);

    document.getElementById("payment-section").innerHTML =
        `<a href="${upiLink}" target="_blank" class="checkout-btn">Pay ₹${total} via UPI</a>`;
    document.getElementById("payment-section").style.display = "block";

    document.getElementById("order-id").innerText = orderId;
    document.getElementById("order-status-box").style.display = "block";
}

// -------------------- PAYMENT CONFIRM --------------------
document.addEventListener("change", e => {
    if(e.target.id === "payment-confirm") {
        const status = document.getElementById("payment-status");
        if(e.target.checked) {
            status.innerText = "Payment Marked as Completed";
            status.style.color = "green";
        } else {
            status.innerText = "Payment Status: Pending";
            status.style.color = "orange";
        }
    }
});

window.onload = loadCart;
</script>

</body>
</html>
